plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    // Elite Hunter X Hunter's API and mod. Until its first public release they come from a local Maven repository: run
    // ./gradlew publish in an Elite HxH checkout and point -PelitehxhRepo at its repo/ folder. The default, ../repo, is the
    // checkout this template ships in. After the release, replace this with the published repository (README.md).
    maven {
        name = 'EliteHxH'
        url = file(providers.gradleProperty('elitehxhRepo').getOrElse('../repo'))
    }
    // GeckoLib, a mod Elite HxH requires: it comes with Elite HxH's own dependencies.
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroupAndSubgroups('com.geckolib')
        }
    }
    // Player Animation Library (PAL), a client mod Elite HxH requires for body animations: it comes with Elite HxH's own
    // dependencies. PAL's libraries (group org.redlance) are published in the same repository.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Redlance'
                url = 'https://repo.redlance.org/public'
            }
        }
        filter {
            includeGroupAndSubgroups('com.zigythebird')
            includeGroupAndSubgroups('org.redlance')
        }
    }
}

sourceSets {
    // Dev-only game tests (src/gametest): part of this mod in dev runs, never in the jar.
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Runs this addon's game tests and exits; the log is run-gametest/logs/latest.log.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            programArguments.addAll '--tests', "${project.mod_id}:*"
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

dependencies {
    // Compile against Elite HxH's API only: anything outside it does not compile, so the addon keeps working across the
    // Elite HxH releases its compatibility rules cover.
    compileOnly "${elitehxh_group}:elitehxh-api:${elitehxh_version}"
    gametestCompileOnly "${elitehxh_group}:elitehxh-api:${elitehxh_version}"
    // The full mod, so the run configurations load it (GeckoLib comes with it).
    runtimeOnly "${elitehxh_group}:elitehxh:${elitehxh_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            neo_version            : neo_version,
            minecraft_version_range: minecraft_version_range,
            elitehxh_version_range : elitehxh_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
