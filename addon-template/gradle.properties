org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.99

# Your addon. Keep mod_id equal to ExampleIds.MODID and to the assets/<mod_id> folder.
mod_id=examplenenaddon
mod_name=Example Nen Addon
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.example.nenaddon

# Elite Hunter X Hunter: the API to compile against and the mod for the run configurations.
elitehxh_group=com.johnadmin.elitehxh
elitehxh_version=0.1.0
# The versionRange on elitehxh in neoforge.mods.toml. Until Elite HxH 1.0.0 any minor version may break the API, so pin
# the exact 0.x version you built against.
elitehxh_version_range=[0.1.0]
